{% extends 'base.html' %}
{% block title %}Вход — PIRATE PUZZLES{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Вход</h2>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Неверный логин или пароль
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Войти</button>
                </form>

                <p class="text-center mt-3">
                    Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
