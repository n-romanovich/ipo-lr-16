{% extends 'base.html' %}
{% load static %}
{% block title %}Каталог — PIRATE PUZZLES{% endblock %}
{% block content %}

<h1 class="mb-4">Каталог</h1>

<div class="row">
    <div class="col-md-3 mb-4">
        <div class="card p-3">
            <h5 class="mb-3">Фильтры</h5>
            <div class="mb-3">
                <label class="form-label">Категория</label>
                <select id="filterCategory" class="form-select">
                    <option value="">Все</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Производитель</label>
                <select id="filterManufacturer" class="form-select">
                    <option value="">Все</option>
                    {% for man in manufacturers %}
                        <option value="{{ man.id }}">{{ man.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Поиск</label>
                <input type="text" id="filterSearch" class="form-control" placeholder="Название...">
            </div>
            <button id="applyFilters" class="btn btn-dark w-100">Применить</button>
        </div>
    </div>

    <div class="col-md-9">
        <div id="loadingSpinner" class="text-center py-5">
            <div class="spinner-border text-secondary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2 text-muted">Загрузка товаров...</p>
        </div>

        <div id="productGrid" class="row"></div>

        <nav id="paginationNav" class="mt-4" style="display:none;">
            <ul class="pagination justify-content-center" id="paginationList"></ul>
        </nav>

        <div id="errorMessage" class="alert alert-danger" style="display:none;"></div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
